spring.application.name=vidification

# Base de datos H2 embebida (en memoria) — SQL sin instalar nada
spring.datasource.url=jdbc:h2:mem:vidification;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2 (ver las tablas en el navegador): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
