spring:
  application:
    name: habitpet
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
